name: Update Kurator Dashboard

on:
  schedule:
    - cron: "15 * * * *" # har soatning 15-daqiqasida
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kurator-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build from current CRM and MCP data
        env:
          CRM_PHONE: ${{ secrets.CRM_PHONE }}
          CRM_PASS: ${{ secrets.CRM_PASS }}
          JUNIOR_MCP_GATEWAY: ${{ secrets.JUNIOR_MCP_GATEWAY }}
          GITHUB_ACTIONS: "1"
        run: python3 kurator_update.py
      - name: Validate generated dashboard
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          html = Path('kurator.html').read_text()
          match = re.search(r'const __DATA__=(\{.*?\});', html)
          if not match:
              raise SystemExit('Dashboard data is missing')
          data = json.loads(match.group(1))
          churn = data['C']['all']
          curators = data.get('M', {})
          if len(curators) != 7:
              raise SystemExit(f'Expected 7 curators, got {len(curators)}')
          bad_bases = {k: v.get('db_students') for k, v in curators.items()
                       if not 50 <= int(v.get('db_students') or 0) <= 1000}
          if bad_bases:
              raise SystemExit(f'Invalid curator student bases: {bad_bases}')
          current_total = sum(int(v['db_students']) for v in curators.values())
          if not 1000 <= current_total <= 5000:
              raise SystemExit(f'Invalid current student total: {current_total}')
          if churn['count'] < 0 or churn['base'] <= 0:
              raise SystemExit('Invalid churn/base values')
          if churn['frozen'] + churn['archive'] != churn['count']:
              raise SystemExit('Churn breakdown does not match total')
          expected = round(churn['count'] * 100 / churn['base'], 2)
          if abs(expected - float(churn['pct'])) > 0.02:
              raise SystemExit(f'Invalid churn percent: {churn}')
          audit = data.get('AUDIT', {})
          cards = len(data.get('CL', {}).get('all', []))
          if churn['count'] != cards or audit.get('mcp_cards') != cards:
              raise SystemExit(f'Churn audit mismatch: churn={churn}, cards={cards}, audit={audit}')
          weekly_verified = sum(int(x.get('count',0)) for x in data.get('H',{}).get('all',{}).values())
          curator_sum = sum(int(x.get('count',0)) for x in data.get('C',{}).get('curators',{}).values())
          team_sum = sum(int(x.get('count',0)) for x in data.get('C',{}).get('teams',{}).values())
          if len({cards, weekly_verified, curator_sum, team_sum}) != 1:
              raise SystemExit(f'Churn totals differ: cards={cards}, weekly={weekly_verified}, curators={curator_sum}, teams={team_sum}')
          ids = [int(x['id']) for x in data.get('CL',{}).get('all',[])]
          if len(ids) != len(set(ids)):
              raise SystemExit('Duplicate student_id in canonical churn list')
          if audit.get('status') != 'verified':
              raise SystemExit(f'Churn audit is not verified: {audit}')
          print('Validated:', churn, audit)
          PY
      - name: Publish changed data
        run: |
          git config user.name "kurator-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add kurator.html kurator-rating-test.html kurator-attendance-test.html
          git diff --cached --quiet || git commit -m "Auto-update kurator dashboard"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
