name: update-kassir-tasks

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kassir-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate cashier tasks dashboard
        run: python3 kassir_refresh.py
      - name: Commit & push if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add kassir-vazifalar.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "auto-update cashier tasks"
            git push
          fi
