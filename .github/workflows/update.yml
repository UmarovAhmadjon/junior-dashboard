name: update-dashboard

on:
  schedule:
    # MCP is pull-only, so poll four times per hour. The generator commits only
    # when CRM/MCP data changed, avoiding unnecessary GitHub Pages publishes.
    - cron: "7,22,37,52 * * * *"
  # Independent backup: refresh debts whenever the curator updater completes.
  workflow_run:
    workflows: ["Update Kurator Dashboard"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate current dashboard cycle from CRM Qarzdorlar module
        env:
          CRM_PHONE: ${{ secrets.CRM_PHONE }}
          CRM_PASS: ${{ secrets.CRM_PASS }}
          JUNIOR_MCP_GATEWAY: ${{ secrets.JUNIOR_MCP_GATEWAY || vars.JUNIOR_MCP_GATEWAY }}
        run: python3 crm_debtors_update.py

      - name: Commit & push if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index*.html weeks*.html
          if git diff --cached --quiet; then
            echo "No changes - skip commit"
          else
            git commit -m "auto-update all dashboard periods"
            git pull --rebase origin main
            git push
          fi
