name: update-dashboard

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 25.07-24.08 dashboard from CRM Qarzdorlar module
        env:
          CRM_PHONE: ${{ secrets.CRM_PHONE }}
          CRM_PASS: ${{ secrets.CRM_PASS }}
        run: python3 crm_debtors_update.py

      - name: Generate cashier tasks dashboard (DB via gateway)
        continue-on-error: true
        env:
          JUNIOR_MCP_GATEWAY: ${{ secrets.JUNIOR_MCP_GATEWAY || vars.JUNIOR_MCP_GATEWAY }}
        run: python3 kassir_refresh.py

      - name: Commit & push if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index*.html weeks*.html cashiers*.html kassir-vazifalar.html
          if git diff --cached --quiet; then
            echo "No changes - skip commit"
          else
            git commit -m "auto-update all dashboard periods"
            git pull --rebase origin main
            git push
          fi
