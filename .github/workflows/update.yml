name: update-dashboard

on:
  schedule:
    # Refresh independently of any user's computer.
    # Poll every 15 minutes so a delayed/failed GitHub runner still produces
    # at least one successful refresh within the hour. Commits occur only
    # when the generated data or timestamp changes.
    - cron: "*/15 * * * *"
  # Independent backup: refresh debts whenever the curator updater completes.
  workflow_run:
    workflows: ["Update Kurator Dashboard"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate current MCP dashboard for production and test
        env:
          CRM_PHONE: ${{ secrets.CRM_PHONE }}
          CRM_PASS: ${{ secrets.CRM_PASS }}
          JUNIOR_MCP_GATEWAY: ${{ secrets.JUNIOR_MCP_GATEWAY || vars.JUNIOR_MCP_GATEWAY }}
        run: |
          MCP_TEST_OUT=index.html DASHBOARD_LABEL=LIVE python3 mcp_dashboard_build.py
          DASHBOARD_CYCLE_START=2026-09-24 MCP_TEST_OUT=index-cycle-2026-09-24.html DASHBOARD_LABEL=LIVE python3 mcp_dashboard_build.py
          MCP_TEST_OUT=mcp-test/index.html DASHBOARD_LABEL="MCP TEST" python3 mcp_dashboard_build.py

      - name: Commit & push if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html mcp-test/index.html cycle-snapshots/ index-cycle-*.html
          if git diff --cached --quiet; then
            echo "No changes - skip commit"
          else
            git commit -m "auto-update all dashboard periods"
            git pull --rebase origin main
            git push
          fi
