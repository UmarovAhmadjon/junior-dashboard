name: update-dashboard

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 26.07-24.08 dashboard from Junior MCP QARZDORLAR
        run: |
          for period in month w1 w2 w3 w4; do
            python3 mcp_live_update.py "$period"
          done

      - name: Commit & push if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index*.html weeks*.html cashiers*.html
          if git diff --cached --quiet; then
            echo "No changes - skip commit"
          else
            git commit -m "auto-update all dashboard periods"
            git pull --rebase origin main
            git push
          fi
