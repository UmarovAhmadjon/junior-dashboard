name: update-dashboard

on:
  schedule:
    # Refresh independently of any user's computer.
    # Poll every 15 minutes so a delayed/failed GitHub runner still produces
    # at least one successful refresh within the hour. Commits occur only
    # when the generated data or timestamp changes.
    - cron: "*/15 * * * *"
  # Independent backup: refresh debts whenever the curator updater completes.
  workflow_run:
    workflows: ["Update Kurator Dashboard"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run dashboard regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Generate current MCP dashboard for production and test
        env:
          CRM_PHONE: ${{ secrets.CRM_PHONE }}
          CRM_PASS: ${{ secrets.CRM_PASS }}
          JUNIOR_MCP_GATEWAY: ${{ secrets.JUNIOR_MCP_GATEWAY || vars.JUNIOR_MCP_GATEWAY }}
        run: |
          python3 - <<'PY'
          import mcp_dashboard_build as dashboard
          data = dashboard.load_data()
          for path, label in [('index.html', 'LIVE'), ('mcp-test/index.html', 'MCP TEST')]:
              dashboard.OUT = path
              dashboard.SITE_LABEL = label
              dashboard.render(*data)
          PY

      # A temporary archived CRM report outage must not block current payments.
      # On failure the previously published archive remains untouched.
      - name: Refresh historical archive independently
        continue-on-error: true
        env:
          CRM_PHONE: ${{ secrets.CRM_PHONE }}
          CRM_PASS: ${{ secrets.CRM_PASS }}
          JUNIOR_MCP_GATEWAY: ${{ secrets.JUNIOR_MCP_GATEWAY || vars.JUNIOR_MCP_GATEWAY }}
        run: DASHBOARD_CYCLE_START=2026-09-24 MCP_TEST_OUT=index-cycle-2026-09-24.html DASHBOARD_LABEL=LIVE python3 mcp_dashboard_build.py

      - name: Refresh previous cycle archive (25.10-23.11)
        continue-on-error: true
        env:
          CRM_PHONE: ${{ secrets.CRM_PHONE }}
          CRM_PASS: ${{ secrets.CRM_PASS }}
          JUNIOR_MCP_GATEWAY: ${{ secrets.JUNIOR_MCP_GATEWAY || vars.JUNIOR_MCP_GATEWAY }}
        run: DASHBOARD_CYCLE_START=2026-10-25 MCP_TEST_OUT=index-cycle-2026-10-25.html DASHBOARD_LABEL=LIVE python3 mcp_dashboard_build.py

      - name: Validate confirmed business rules
        run: python3 dashboard_validate.py

      - name: Commit & push if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html mcp-test/index.html cycle-snapshots/ index-cycle-*.html approved-plans/sales-upsells.json
          if git diff --cached --quiet; then
            echo "No changes - skip commit"
          else
            git commit -m "auto-update all dashboard periods"
            git pull --rebase origin main
            git push
          fi
